<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#04050c">
<title>موسوعة السيّارات — Encyclopédie Auto</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Amiri:wght@400;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --void:#04050c; --bg1:#070a16; --bg2:#0b1430; --navy:#0d1a6e;
  --g-lo:#a87f2a; --g-mid:#e3c25a; --g-hi:#f8e7a6;
  --ink:#eef1fb; --muted:#8a97c2;
  --line:rgba(227,194,90,.22); --line2:rgba(227,194,90,.5);
  --glass:rgba(11,18,44,.55);
}
html{scroll-behavior:smooth}
body{
  font-family:'Tajawal',system-ui,'Segoe UI',sans-serif;
  color:var(--ink);min-height:100vh;overflow-x:hidden;position:relative;
  background:
    radial-gradient(620px 320px at 50% -40px,rgba(227,194,90,.10),transparent 70%),
    radial-gradient(800px 600px at 90% 5%,rgba(13,26,110,.55),transparent 60%),
    radial-gradient(700px 700px at 0% 100%,rgba(13,26,110,.35),transparent 60%),
    linear-gradient(165deg,var(--void),var(--bg1) 45%,var(--void));
  background-attachment:fixed;
}
/* faint metallic sheen + vignette */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.015) 0 1px,transparent 1px 7px);opacity:.6}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(140% 120% at 50% 35%,transparent 55%,rgba(0,0,0,.55))}

.edge{position:fixed;left:0;right:0;height:2px;z-index:60;
  background:linear-gradient(90deg,transparent,var(--g-lo),var(--g-hi),var(--g-mid),var(--g-lo),transparent)}
.edge.top{top:0}.edge.bot{bottom:0}

.wrap{max-width:1080px;margin:0 auto;padding:30px 16px 80px;position:relative;z-index:2;
  animation:fade .5s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ===== HEADER ===== */
header{text-align:center;padding:14px 6px 4px}
.bism{font-family:'Amiri',serif;font-size:1.05rem;color:var(--g-mid);letter-spacing:1px;
  text-shadow:0 0 16px rgba(227,194,90,.4);margin-bottom:16px;opacity:.92}
.verse{font-family:'Amiri',serif;font-size:1.12rem;line-height:2.1;color:var(--ink);max-width:600px;margin:0 auto;
  padding:16px 22px;border-radius:4px;position:relative;
  background:linear-gradient(180deg,rgba(227,194,90,.05),rgba(11,18,44,.3));
  box-shadow:inset 0 0 30px rgba(227,194,90,.05)}
.verse::before,.verse::after{content:'';position:absolute;left:18px;right:18px;height:1px;
  background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.verse::before{top:0}.verse::after{bottom:0}
.verse small{display:block;color:var(--g-mid);font-size:.74rem;margin-top:8px;font-family:'Tajawal';letter-spacing:1px}

.divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:22px auto 0;max-width:300px}
.divider::before,.divider::after{content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line2))}
.divider i{width:8px;height:8px;background:linear-gradient(145deg,var(--g-hi),var(--g-lo));transform:rotate(45deg);
  box-shadow:0 0 10px rgba(227,194,90,.6)}

.title{position:relative;margin-top:24px}
.title::before{content:'';position:absolute;left:50%;top:-26px;transform:translateX(-50%);width:360px;height:170px;
  background:radial-gradient(closest-side,rgba(227,194,90,.18),transparent 72%);z-index:-1}
.title h1{font-size:clamp(2rem,7vw,2.7rem);font-weight:900;letter-spacing:1px;line-height:1.1;
  background:linear-gradient(180deg,var(--g-hi),var(--g-mid) 55%,var(--g-lo));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.5))}
.title .sub{color:var(--muted);font-size:.82rem;margin-top:8px;letter-spacing:5px;text-transform:uppercase}

/* ===== STATS ===== */
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:28px 0 4px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:14px 22px;min-width:104px;
  backdrop-filter:blur(10px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.stat b{display:block;font-size:1.7rem;font-weight:900;
  background:linear-gradient(180deg,var(--g-hi),var(--g-mid));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat span{font-size:.74rem;color:var(--muted);letter-spacing:1px}

/* ===== CONTROLS ===== */
.controls{margin:30px 0 20px;position:sticky;top:0;z-index:55;padding:16px 12px 12px;
  background:rgba(4,5,12,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-top:none;border-radius:0 0 18px 18px;
  box-shadow:0 14px 30px -10px rgba(0,0,0,.75)}
.search{position:relative;max-width:640px;margin:0 auto 16px}
.search input{width:100%;background:rgba(4,5,12,.88);border:1.5px solid var(--line);border-radius:16px;color:var(--ink);
  font-family:'Tajawal';font-size:1rem;padding:15px 50px 15px 18px;outline:none;backdrop-filter:blur(12px);
  transition:border-color .2s,box-shadow .2s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--g-mid);box-shadow:0 0 0 4px rgba(227,194,90,.14),0 10px 30px rgba(0,0,0,.45)}
.search .ico{position:absolute;top:50%;right:18px;transform:translateY(-50%);color:var(--g-mid);font-size:1.2rem;pointer-events:none}

.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:4px}
.glabel{width:100%;text-align:center;color:var(--g-mid);font-size:.7rem;letter-spacing:3px;margin:10px 0 4px;text-transform:uppercase;opacity:.8}
.chip{background:rgba(11,18,44,.5);border:1px solid var(--line);border-radius:999px;color:var(--muted);font-family:'Tajawal';
  font-weight:700;font-size:.82rem;padding:8px 15px;cursor:pointer;transition:.18s;backdrop-filter:blur(6px);user-select:none}
.chip:hover{color:var(--ink);border-color:var(--line2)}
.chip.active{background:linear-gradient(180deg,var(--g-hi),var(--g-mid) 60%,var(--g-lo));color:#241900;border-color:var(--g-hi);
  font-weight:800;box-shadow:0 5px 16px rgba(227,194,90,.3)}

/* ===== GRID ===== */
.grid{display:grid;grid-template-columns:1fr;gap:15px;margin-top:10px}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:920px){.grid{grid-template-columns:1fr 1fr 1fr}}

.card{background:linear-gradient(180deg,rgba(11,18,44,.62),rgba(6,9,20,.6));border:1px solid var(--line);
  border-radius:20px;padding:18px;cursor:pointer;position:relative;overflow:hidden;backdrop-filter:blur(12px);
  box-shadow:0 8px 22px rgba(0,0,0,.3);transition:transform .3s ease,box-shadow .3s,border-color .3s}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--g-mid),transparent);opacity:.55}
.card::after{content:'';position:absolute;top:-40%;right:-30%;width:160px;height:160px;
  background:radial-gradient(closest-side,rgba(227,194,90,.12),transparent 70%);opacity:0;transition:opacity .3s}
.card:hover{transform:translateY(-4px);border-color:var(--line2);z-index:5;
  box-shadow:0 20px 44px rgba(0,0,0,.5),0 0 0 1px var(--line2),0 0 32px rgba(227,194,90,.07)}
.card:hover::after{opacity:1}

.card-top{display:flex;align-items:center;gap:13px;margin-bottom:12px}
.emblem{width:56px;height:56px;flex:0 0 56px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  font-family:'Tajawal';font-weight:900;font-size:1.32rem;color:#2a1d00;
  background:linear-gradient(145deg,var(--g-hi),var(--g-mid) 50%,var(--g-lo));
  text-shadow:0 1px 0 rgba(255,255,255,.35);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.55),inset 0 -4px 8px rgba(120,80,0,.4),0 6px 16px rgba(0,0,0,.4)}
.card h3{font-size:1.14rem;font-weight:800;letter-spacing:.3px}
.card .country{font-size:.78rem;color:var(--muted);margin-top:3px}
.card .spec{font-size:.88rem;color:var(--g-mid);line-height:1.55;margin:10px 0 14px;min-height:40px}
.card .badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.3px}
.b-cat{background:rgba(227,194,90,.12);color:var(--g-hi);border:1px solid var(--line)}
.b-year{background:rgba(138,151,194,.12);color:var(--muted);border:1px solid rgba(138,151,194,.25)}

.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:46px 10px;font-size:1.05rem}
.empty b{color:var(--g-hi);display:block;font-size:1.3rem;margin-bottom:6px}

/* ===== MODAL ===== */
.overlay{position:fixed;inset:0;background:rgba(2,4,12,.85);backdrop-filter:blur(7px);z-index:100;
  display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
@media(min-width:700px){.overlay{align-items:center;padding:20px}}
.modal{background:linear-gradient(170deg,var(--bg2),var(--bg1) 55%,var(--void));border:1px solid var(--line2);
  border-radius:26px 26px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;position:relative;
  box-shadow:0 -14px 70px rgba(0,0,0,.7),0 0 0 1px rgba(227,194,90,.15);animation:pop .22s ease}
@media(min-width:700px){.modal{border-radius:26px}}
@keyframes pop{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
.modal::-webkit-scrollbar{width:8px}.modal::-webkit-scrollbar-thumb{background:var(--g-mid);border-radius:8px}

.m-close{position:absolute;top:14px;left:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
  background:rgba(4,5,12,.7);color:var(--g-hi);font-size:1.3rem;cursor:pointer;z-index:5;
  display:flex;align-items:center;justify-content:center;transition:.2s}
.m-close:hover{background:linear-gradient(145deg,var(--g-hi),var(--g-lo));color:#241900;border-color:var(--g-hi)}

.m-hero{padding:34px 22px 20px;text-align:center;position:relative;
  border-bottom:1px solid var(--line);background:radial-gradient(300px 150px at 50% 0%,rgba(227,194,90,.14),transparent 72%)}
.m-emblem{width:90px;height:90px;margin:0 auto 16px;border-radius:24px;display:flex;align-items:center;justify-content:center;
  font-family:'Tajawal';font-weight:900;font-size:2.1rem;color:#2a1d00;
  background:linear-gradient(145deg,var(--g-hi),var(--g-mid) 50%,var(--g-lo));text-shadow:0 1px 0 rgba(255,255,255,.4);
  box-shadow:inset 0 3px 5px rgba(255,255,255,.55),inset 0 -5px 10px rgba(120,80,0,.4),0 12px 30px rgba(0,0,0,.5)}
.m-hero h2{font-size:1.9rem;font-weight:900;letter-spacing:.5px;
  background:linear-gradient(180deg,var(--g-hi),var(--g-mid));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.m-hero .flagline{color:var(--muted);font-size:.92rem;margin-top:7px}
.m-slogan{font-family:'Amiri',serif;font-style:italic;color:var(--g-mid);font-size:1.02rem;margin-top:12px;opacity:.95}

.m-meta{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:20px 22px}
.meta{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:13px 15px;backdrop-filter:blur(6px)}
.meta .k{font-size:.7rem;color:var(--g-mid);letter-spacing:1px;margin-bottom:5px;text-transform:uppercase}
.meta .v{font-size:1rem;color:var(--ink);font-weight:700;line-height:1.4}

.m-section{padding:6px 22px 20px}
.m-section h4{color:var(--g-hi);font-size:1.06rem;font-weight:800;margin-bottom:13px;display:flex;align-items:center;gap:9px}
.m-section h4::before{content:'';width:5px;height:20px;border-radius:3px;background:linear-gradient(var(--g-hi),var(--g-lo))}
.tech-list{display:flex;flex-direction:column;gap:9px}
.tech{background:linear-gradient(90deg,rgba(227,194,90,.07),rgba(11,18,44,.25));border:1px solid var(--line);
  border-radius:12px;padding:12px 15px;font-size:.94rem;line-height:1.6;display:flex;gap:11px;align-items:flex-start}
.tech i{color:var(--g-mid);font-style:normal;font-size:.95rem;flex:0 0 auto;margin-top:3px}

.models{display:flex;gap:8px;flex-wrap:wrap}
.model{background:rgba(227,194,90,.12);border:1px solid var(--line);border-radius:11px;padding:9px 14px;font-size:.9rem;
  font-weight:700;color:var(--g-hi);cursor:pointer;transition:.18s;user-select:none}
.model:hover{border-color:var(--line2)}
.model.sel{background:linear-gradient(180deg,var(--g-hi),var(--g-lo));color:#241900;border-color:var(--g-hi)}
.m-note{color:var(--muted);font-size:.8rem;margin:-4px 0 12px}

.panel{margin-top:16px;border-top:1px dashed var(--line);padding-top:16px}
.panel-title{color:var(--g-hi);font-weight:800;font-size:1rem;margin-bottom:12px}
.spec-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:16px}
@media(min-width:480px){.spec-grid{grid-template-columns:1fr 1fr}}
.spec-box{background:var(--glass);border:1px solid var(--line);border-radius:13px;padding:12px 14px;backdrop-filter:blur(6px)}
.spec-box.full{grid-column:1/-1}
.spec-box .k{font-size:.68rem;color:var(--g-mid);letter-spacing:1px;margin-bottom:5px;text-transform:uppercase}
.spec-box .v{font-size:.96rem;color:var(--ink);font-weight:700;line-height:1.5}

.src-label{color:var(--muted);font-size:.74rem;letter-spacing:1px;margin-bottom:9px;text-transform:uppercase}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.act{display:flex;align-items:center;gap:9px;text-decoration:none;border:1px solid var(--line);border-radius:12px;
  padding:12px 13px;color:var(--ink);font-weight:700;font-size:.88rem;transition:background .2s,border-color .2s;
  background:linear-gradient(180deg,rgba(227,194,90,.08),rgba(11,18,44,.4))}
.act:hover{border-color:var(--line2);background:linear-gradient(180deg,rgba(227,194,90,.16),rgba(11,18,44,.5))}
.act .ai{font-size:1.15rem;flex:0 0 auto}
.act-note{color:var(--muted);font-size:.72rem;margin-top:11px;line-height:1.6;text-align:center;opacity:.8}

/* ===== FOOTER ===== */
footer{text-align:center;margin-top:50px;padding-top:26px;position:relative}
footer::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:1px;
  background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.sign{font-family:'Amiri',serif;font-size:1.06rem;color:var(--g-hi);letter-spacing:1px;text-shadow:0 0 14px rgba(227,194,90,.3)}
.sign small{display:block;color:var(--muted);font-family:'Tajawal';font-size:.76rem;margin-top:7px;letter-spacing:2px}

.hist-text{background:linear-gradient(90deg,rgba(227,194,90,.06),rgba(11,18,44,.2));border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:.95rem;line-height:1.85;color:var(--ink)}
.fiab{margin-top:10px;font-size:.9rem;color:var(--muted);display:flex;gap:8px;align-items:flex-start;line-height:1.6}
.fiab b{color:var(--g-mid);font-weight:700;flex:0 0 auto}
.model-hist{background:rgba(11,18,44,.4);border:1px solid var(--line);border-right:3px solid var(--g-mid);border-radius:10px;padding:11px 14px;font-size:.92rem;line-height:1.8;color:var(--ink);margin-bottom:13px}
.car-photo-wrap{width:100%;border-radius:14px;overflow:hidden;margin-bottom:14px;min-height:180px;
  background:linear-gradient(135deg,rgba(11,18,44,.8),rgba(4,5,12,.9));display:flex;align-items:center;justify-content:center;position:relative}
.car-photo-wrap img{width:100%;max-height:230px;object-fit:cover;display:block;border-radius:14px}
.car-photo-wrap .loading{color:var(--muted);font-size:.88rem;text-align:center;padding:30px}
.car-photo-wrap .photo-fail{color:var(--muted);font-size:.82rem;text-align:center;padding:20px;line-height:1.7}
.car-photo-wrap .photo-fail a{color:var(--g-hi);text-decoration:none;font-weight:700;display:block;margin-top:8px;padding:8px 14px;border:1px solid var(--line);border-radius:8px}
.photo-link{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;margin-bottom:14px;
  background:linear-gradient(180deg,rgba(227,194,90,.18),rgba(11,18,44,.5));border:1px solid var(--line2);border-radius:12px;
  padding:13px;color:var(--g-hi);font-weight:800;font-size:.95rem;transition:.2s}
.photo-link:hover{background:rgba(227,194,90,.26)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="edge top"></div>
<div class="edge bot"></div>

<div class="wrap">
  <header>
    <div class="bism">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    <div class="verse">
      سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ
      <small>سورة الزخرف — الآية ١٣</small>
    </div>
    <div class="divider"><i></i></div>
    <div class="title">
      <h1>موسوعة السيّارات</h1>
      <div class="sub">Encyclopédie des Marques</div>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><b id="s-brands">0</b><span>ماركة</span></div>
    <div class="stat"><b id="s-countries">0</b><span>دولة</span></div>

  <div class="controls">
    <div class="search">
      <input id="q" type="search" placeholder="ابحث عن ماركة أو موديل…" autocomplete="off">
      <span class="ico">⌕</span>
    </div>
    <div class="chips" id="catChips"><div class="glabel">التصنيف · Catégorie</div></div>

  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <div class="sign">LORD SIDHOM I — The Conceptor<small>KIEDA · موسوعة السيّارات</small></div>
  </footer>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
/* ===== DATA ===== */
const CATS={luxe:"فخامة",sport:"رياضية",elec:"كهربائية",general:"شعبية",offroad:"٤×٤",hyper:"هايبر"};
const COUNTRIES={de:"🇩🇪 ألمانيا",it:"🇮🇹 إيطاليا",gb:"🇬🇧 بريطانيا",fr:"🇫🇷 فرنسا",us:"🇺🇸 أمريكا",jp:"🇯🇵 اليابان",kr:"🇰🇷 كوريا",se:"🇸🇪 السويد",cn:"🇨🇳 الصين"};

const BRANDS=[
 {n:"Mercedes-Benz",ab:"MB",c:"de",cat:"luxe",year:1926,founder:"Karl Benz & Gottlieb Daimler",slogan:"Das Beste oder nichts",
  spec:"رائدة الفخامة والسلامة الألمانية",
  tech:["أول من ابتكر منطقة الانكماش (Crumple Zone) وABS والوسادة الهوائية","دفع رباعي ذكي 4MATIC","قسم الأداء AMG بمحركات يدوية الصنع","عائلة EQ الكهربائية بالكامل"],
  models:[{m:"Classe S",t:"سيدان فاخرة كبيرة",e:"6 مستقيم/V8 · خلفي أو 4MATIC"},{m:"Classe G",t:"دفع رباعي فاخر صلب",e:"V8 (AMG) · رباعي دائم + 3 أقفال تفاضلية"},{m:"AMG GT",t:"كوبيه رياضية فائقة",e:"V8 بيتوربو · خلفي/رباعي"},{m:"EQS",t:"سيدان كهربائية فاخرة",e:"كهربائي · مدى يتجاوز 600 كم"}]},
 {n:"BMW",ab:"M",c:"de",cat:"sport",year:1916,founder:"Karl Rapp",slogan:"Freude am Fahren",

function animateCount(id,target){const el=document.getElementById(id);let c=0;const step=Math.max(1,Math.ceil(target/28));
 const t=setInterval(()=>{c+=step;if(c>=target){c=target;clearInterval(t)}el.textContent=c},26);}

function addChip(parent,label,val,type){
 const c=document.createElement("div");
 c.className="chip"+(val==="all"?" active":"");c.textContent=label;
 c.onclick=()=>{parent.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));c.classList.add("active");
  if(type==="cat")activeCat=val;else activeCountry=val;render();};
 parent.appendChild(c);
}

/* ===== SEARCH ===== */
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render();});

/* ===== RENDER ===== */
const grid=document.getElementById("grid");
function render(){
 const list=BRANDS.filter(b=>{
  const okCat=activeCat==="all"||catsOf(b).includes(activeCat);
  const okCo=activeCountry==="all"||b.c===activeCountry;
  const okQ=!query||b.n.toLowerCase().includes(query)||(COUNTRIES[b.c]||"").toLowerCase().includes(query)||b.models.some(x=>x.m.toLowerCase().includes(query));
  return okCat&&okCo&&okQ;
 });
 grid.innerHTML="";
 if(!list.length){grid.innerHTML='<div class="empty"><b>لا توجد نتائج</b>جرّب اسم ماركة آخر أو غيّر الفلاتر</div>';return;}
 list.forEach(b=>{
  const card=document.createElement("div");card.className="card";
  card.innerHTML=`
   <div class="card-top">
     <div class="emblem">${b.ab}</div>
     <div><h3>${b.n}</h3><div class="country">${COUNTRIES[b.c]}</div></div>
   </div>
   <div class="spec">${b.spec}</div>
   <div class="badges">${catsOf(b).map(c=>`<span class="badge b-cat">${CATS[c]}</span>`).join("")}<span class="badge b-year">${b.year}</span></div>`;
  card.onclick=()=>openModal(b);
  grid.appendChild(card);
 });
}

/* ===== MODAL ===== */
const overlay=document.getElementById("overlay"),modal=document.getElementById("modal");
function openModal(b){
 curBrand=b;
 modal.innerHTML=`
  <button class="m-close" onclick="closeModal()">✕</button>
  <div class="m-hero">
    <div class="m-emblem">${b.ab}</div>
    <h2>${b.n}</h2>
    <div class="flagline">${COUNTRIES[b.c]} · ${catsOf(b).map(c=>CATS[c]).join(" · ")}</div>
    <div class="m-slogan">« ${b.slogan} »</div>
  </div>
  <div class="m-meta">
    <div class="meta"><div class="k">سنة التأسيس</div><div class="v">${b.year}</div></div>
    <div class="meta"><div class="k">المؤسّس</div><div class="v">${b.founder}</div></div>
  </div>
  ${DETAIL[b.n]?`<div class="m-section">
    <h4>التاريخ · Histoire de la marque</h4>
    <div class="hist-text">${DETAIL[b.n].hist}</div>
    <div class="fiab"><b>الاعتمادية:</b><span>${DETAIL[b.n].fiab}</span></div>
  </div>`:""}
  <div class="m-section">
    <h4>الجانب التقني · Côté technique</h4>
    <div class="tech-list">${b.tech.map(t=>`<div class="tech"><i>◆</i><span>${t}</span></div>`).join("")}</div>
  </div>
  <div class="m-section">
    <h4>النماذج · اختر موديلاً</h4>
    <div class="m-note">اضغط على موديل لعرض مواصفاته الكاملة</div>
    <div class="models" id="modelChips">${b.models.map((x,i)=>`<span class="model" data-i="${i}" onclick="selModel(${i})">${x.m}</span>`).join("")}</div>
    <div id="panel"></div>
  </div>`;
 overlay.classList.add("show");document.body.style.overflow="hidden";modal.scrollTop=0;
 selModel(0);
}
function aurl(kind,q){
 const terms={video:q+" essai review مراجعة",crash:q+" Euro NCAP crash test sécurité",avis:q+" essai avis test propriétaires",prix:q+" prix fiche technique 2026"};
 const base=(kind==="video")?"https://www.youtube.com/results?search_query=":"https://www.google.com/search?q=";
 return base+encodeURIComponent(terms[kind]);
}
function selModel(i){
 const b=curBrand;if(!b)return;
 document.querySelectorAll("#modelChips .model").forEach(x=>x.classList.remove("sel"));
 const chip=document.querySelector('#modelChips .model[data-i="'+i+'"]');if(chip)chip.classList.add("sel");
 const x=b.models[i],q=b.n+" "+x.m;
 const d=(DETAIL[b.n]&&DETAIL[b.n].m&&DETAIL[b.n].m[x.m])?DETAIL[b.n].m[x.m]:null;
 document.getElementById("panel").innerHTML=`
  <div class="panel">
    <div class="panel-title">${b.n} ${x.m}</div>
    ${d&&d.h?`<div class="model-hist">${d.h}</div>`:""}
    <div class="car-photo-wrap" id="photoBox"><div class="loading">⏳ تحميل الصورة…</div></div>
    <div class="spec-grid">
      <div class="spec-box"><div class="k">النوع · Type</div><div class="v">${x.t}</div></div>
      <div class="spec-box"><div class="k">الدفع · Transmission</div><div class="v">${x.e}</div></div>
      ${d&&d.fuel?`<div class="spec-box"><div class="k">الوقود والسعة · Carburant</div><div class="v">${d.fuel}</div></div>`:""}
      ${d&&d.maker?`<div class="spec-box"><div class="k">صانع المحرك · Motoriste</div><div class="v">${d.maker}</div></div>`:""}
      ${d&&d.batt?`<div class="spec-box full"><div class="k">البطارية / المحرك الكهربائي</div><div class="v">${d.batt}</div></div>`:""}
    </div>
    <div class="src-label">المزيد من المصادر الرسمية الحيّة</div>
    <div class="actions">
      <a class="act" target="_blank" rel="noopener" href="${aurl('video',q)}"><span class="ai">🎥</span> فيديوهات ومراجعات</a>
      <a class="act" target="_blank" rel="noopener" href="${aurl('crash',q)}"><span class="ai">💥</span> اختبار التصادم (NCAP)</a>
      <a class="act" target="_blank" rel="noopener" href="${aurl('avis',q)}"><span class="ai">⭐</span> اختبارات وآراء</a>
      <a class="act" target="_blank" rel="noopener" href="${aurl('prix',q)}"><span class="ai">💰</span> السعر الحالي</a>
    </div>
  </div>`;
 loadCarPhoto(b.n, x.m, q);
}
function loadCarPhoto(brand, model, fallbackQ){
 const box=document.getElementById("photoBox");
 if(!box)return;
 const wikiNames=[
  brand+" "+model, model,
  brand+" "+model.replace("Classe ","").replace("Série ","").replace("ë-",""),
  model.replace("Classe S","S-Class").replace("Classe G","G-Class").replace("Série ","Serie ")
 ];
 let tried=0;
 function tryNext(){
  if(tried>=wikiNames.length){
   box.innerHTML=`<div class="photo-fail">صورة غير متوفرة من Wikipedia<a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(fallbackQ)}" target="_blank" rel="noopener">🔍 بحث عن الصور</a></div>`;
   return;
  }
  const q=wikiNames[tried++];
  fetch(`https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(q)}&prop=pageimages&format=json&pithumbsize=800&origin=*`)
   .then(r=>r.json())
   .then(data=>{
    const page=Object.values(data.query.pages)[0];
    if(page.thumbnail&&page.thumbnail.source){
     const img=new Image();
     img.onload=()=>{box.innerHTML="";box.appendChild(img)};
     img.onerror=tryNext;
     img.src=page.thumbnail.source;
     img.alt=brand+" "+model;
     img.style.cssText="width:100%;max-height:230px;object-fit:cover;border-radius:14px;display:block";
    } else tryNext();
   }).catch(tryNext);
 }
 tryNext();
}
function closeModal(){overlay.classList.remove("show");document.body.style.overflow="";}
overlay.addEventListener("click",e=>{if(e.target===overlay)closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

render();
</script>
